name: Check data

# Runs on every push and pull request: makes sure every data file is valid
# JSON and that every command and mob in the game has a kid-friendly entry.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data files are valid JSON
        run: |
          for f in data/*.json; do python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }; done
      - name: Every command has an explanation
        run: python3 scripts/check_coverage.py data/commands-data.json data/content.json
      - name: Every mob and thing has an entry
        run: python3 scripts/check_entities.py data/entities-data.json data/entities.json
